# Build the app and run the test suite on every pull request and push to main.
#
# The Xcode project is generated from project.yml, so XcodeGen is installed first;
# nothing generated is ever committed. Builds are ad-hoc signed (`make build`), so the
# runner needs no certificate. The tests run in GeorgDevTool, a development-only app
# that exercises the renderer and the Write mode styler without a window.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: make build

      - name: Test
        run: make test
