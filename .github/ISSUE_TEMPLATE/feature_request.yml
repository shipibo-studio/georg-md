name: Feature request
description: Propose a new feature or improvement.
title: "[feat]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the project? Tell us more.

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: The problem or need behind this request.
      placeholder: It is frustrating when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or approaches you explored, and why you discarded them.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, examples from other projects.
    validations:
      required: false
